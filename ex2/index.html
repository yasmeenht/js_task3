<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="font-decoration">
        <div class="font-style">
            <select>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
                <option value="Calibri">Calibri</option>
            </select>
        </div>

        <div class="font-size">
            <select>
                <option value="8px">8</option>
                <option value="9px">9</option>
                <option value="10px">10</option>
                <option value="11px">11</option>
                <option value="12px">12</option>
                <option value="14px">14</option>
                <option value="16px">16</option>
                <option value="18px">18</option>
                <option value="20px">20</option>
                <option value="22px">22</option>
                <option value="24px">24</option>
                <option value="26px">26</option>
                <option value="28px">28</option>
                <option value="36px">36</option>
                <option value="48px">48</option>
                <option value="72px">72</option>
            </select>
        </div>

        <div class="text-decoration">
            <input type="checkbox" value="italic" id="italic">
            <label for="italic">Italic</label>

            <input type="checkbox" value="bold" id="bold">
            <label for="bold">Bold</label>

            <input type="checkbox" value="underline" id="underline">
            <label for="underline">Underline</label>
        </div>

    </div>


    <div>
        <textarea class="text-box"></textarea>
    </div>
    <script src="script.js"></script>
</body>
</html>
